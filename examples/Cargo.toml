[package]
name = "exo-examples"
version = "0.1.0"
edition = "2024"
license = "GPL-v3"

[dependencies]
embassy-stm32 = { version = "0.6.0", features = [ "defmt", "time-driver-any", "stm32g474rb", "memory-x", "unstable-pac", "exti"]  }
embassy-sync = { version = "0.7.0", features = ["defmt"] }
embassy-executor = { version = "0.7.0", features = ["arch-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.4.0", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-100_000_000"] }
embassy-usb = { version = "0.4.0", features = ["defmt"] }
embassy-futures = { version = "0.1.0" }
usbd-hid = "0.8.1"

defmt = "1.0.1"
defmt-rtt = "1.0.0"

cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.0"
embedded-hal = "0.2.6"
embedded-can = { version = "0.4" }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
heapless = { version = "0.8", default-features = false }
static_cell = "2.0.0"

exo-drivers = { path = "../exo-drivers/" }

[profile.release]
debug = 2
