[package]
name = "exo-drivers"
version = "0.1.0"
edition = "2024"
license = "GPL-v3"

[dependencies]
embassy-stm32 = { version = "0.6.0", features = [ "defmt", "time-driver-any", "stm32g474rb", "unstable-pac", "exti", "single-bank"]  }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }

defmt = "1.0.1"
defmt-rtt = "1.0.0"

embedded-hal = "0.2.6"
embedded-can = { version = "0.4" }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2.0.0"

crc = "3.3.0"

[profile.release]
debug = 2